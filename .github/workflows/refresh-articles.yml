name: Refresh articles

on:
  schedule:
    - cron: "17 5 * * *"   # every day, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-articles.mjs
      - name: Commit if changed
        run: |
          git config user.name "spinpath-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articles.json
          git diff --cached --quiet || (git commit -m "Refresh articles" && git push)
